site_name: BioETL Documentation
site_description: "Reference for the bioactivity data acquisition stack"
repo_url: https://github.com/bioactivity-data/bioactivity_data_acquisition
repo_name: bioactivity_data_acquisition
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.instant
    - content.code.copy
nav:
  - Index: INDEX.md
  - Architecture:
      - Pipeline architecture: architecture.md
  - Configurations:
      - Typed configs and profiles: configs/00-typed-configs-and-profiles.md
      - Profiles: configs/01-config-profiles.md
      - Environment variables: configs/02-env-variables.md
      - Postprocess: configs/03-postprocess.md
  - CLI:
      - Overview: cli/00-cli-overview.md
      - Commands: cli/01-cli-commands.md
      - Config inspect: cli/config-inspect.md
      - Exit codes: cli/02-cli-exit-codes.md
  - Pipelines:
      - Catalog: pipelines/10-pipelines-catalog.md
      - ChEMBL architecture: pipelines/chembl/00-architecture.md
      - Activity config: pipelines/chembl/activity/17-activity-chembl-config.md
      - Assay config: pipelines/chembl/assay/17-assay-chembl-config.md
      - Document config: pipelines/chembl/document/17-document-chembl-config.md
      - Target config: pipelines/chembl/target/17-target-chembl-config.md
      - TestItem config: pipelines/chembl/testitem/17-testitem-chembl-config.md
  - Security:
      - Vault policy: security/00-vault-policy.md
  - QA:
      - Static analysis plan: qa/static_analysis_plan.md
      - Documentation maintenance: qa/documentation_maintenance.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - footnotes
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_signature: true
            docstring_style: google
  - mermaid2
  - table-reader
