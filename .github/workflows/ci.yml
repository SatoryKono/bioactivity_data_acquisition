name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run pytest (fast suite)
        run: pytest --maxfail=1 --disable-warnings -vv tests

      - name: Run Ruff lint
        run: ruff check src tests scripts

      - name: Run mypy
        run: mypy --config-file pyproject.toml src/bioetl src/scripts

      - name: Scan for dead code with vulture
        continue-on-error: true
        run: |
          set -o pipefail
          vulture src tests scripts --min-confidence 80 | tee vulture-report.txt

      - name: Upload vulture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulture-report
          path: vulture-report.txt
