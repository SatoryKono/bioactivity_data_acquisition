[pytest]
# Маркеры для категоризации тестов
markers =
    unit: Unit tests (fast, no IO/network)
    integration: Integration tests (multiple components)
    golden: Golden tests for deterministic output verification
    determinism: Bit-identical determinism verification
    property: Property-based tests (Hypothesis)
    schema: Schema validation tests
    qc: Quality control tests
    slow: Slow tests (>5s execution time)
    api: External API tests (use mocks, not real API)
    benchmark: Performance benchmark tests

# Пути для поиска тестов
testpaths = tests/core tests/infrastructure tests/pipelines tests/golden tests/cli tests/unit tests/integration tests/qc tests/clients

# Python path
pythonpath = src

# Исключаемые директории
norecursedirs = ~src __pycache__ .git .tox dist build *.egg

# Опции по умолчанию
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=src/bioetl
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=85
    --cov-branch
    -ra

# Минимальная версия pytest
minversion = 7.4

# Фильтры предупреждений
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
