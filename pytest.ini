[pytest]
minversion = 7.0
addopts = -q
testpaths = tests
python_files = test_*.py
pythonpath =
    src
markers =
    unit: Fast unit test suite used in CI
    integration: Integration tests that hit HTTP clients and storage
    qc: Quality-control checks for deterministic outputs
    determinism: Ensures data transformations are reproducible
    golden: Golden dataset regression tests
    smoke: Quick smoke tests for basic functionality
