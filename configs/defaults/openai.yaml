# configs/defaults/openai.yaml

# Configuration profile for OpenAI API (Codex, GPT models, etc.)
# OpenAI enforces rate limits based on the API tier and model.
# Refer to: https://platform.openai.com/docs/guides/rate-limits

http:
  profiles:
    openai:
      # --- Timeouts ---
      # OpenAI API can be slow for complex completions; allow generous timeouts.
      timeout_sec: 120.0
      connect_timeout_sec: 15.0
      read_timeout_sec: 120.0

      # --- Retry Policy ---
      retries:
        total: 3
        backoff_multiplier: 2.0
        backoff_max: 30.0
        # OpenAI uses 429 for rate limit exceeded and standard 5xx for server errors.
        statuses: [429, 500, 502, 503, 504]

      # --- Rate Limiting ---
      # These values are conservative defaults; adjust based on your OpenAI tier.
      # Free tier: 3 RPM; Tier 1: 60 RPM; Tier 2: 3500 RPM, etc.
      rate_limit:
        max_calls: 3
        period: 60.0  # 3 requests per minute (conservative for free tier)

      rate_limit_jitter: true

      # --- Circuit Breaker ---
      circuit_breaker:
        failure_threshold: 3
        timeout: 60.0
        half_open_max_calls: 1
        # Don't count 4xx errors as failures for circuit breaker (e.g., 400 bad request).
        ignore_status_codes: [400, 401, 403, 404]

      # --- Default Headers ---
      headers:
        User-Agent: "BioETL/1.0 (OpenAI-Client)"
        Accept: "application/json"
        Accept-Encoding: "gzip, deflate"
        Content-Type: "application/json"

      # OpenAI API URLs are generally short, but keep a reasonable limit.
      max_url_length: 2000
