extends:
  - ../../defaults/base.yaml
  - ../../defaults/determinism.yaml
  - ../../defaults/chembl.yaml
  - ../../defaults/validation.yaml
  - ../../defaults/postprocess.yaml

pipeline:
  name: activity_chembl
  version: "1.0.0"
  owner: "Data Acquisition Team"
  description: "Extract biological activity records from ChEMBL API"

io:
  output:
    partition_by:
      - assay_chembl_id

sources:
  chembl:
    batch_size: 20
    max_url_length: 2000
    parameters:
      base_url: https://www.ebi.ac.uk/chembl/api/data
      select_fields:
        - activity_comment
        - activity_id
        - activity_properties
        - assay_chembl_id
        - assay_description
        - assay_type
        - bao_endpoint
        - bao_format
        - bao_label
        - canonical_smiles
        - data_validity_comment
        - data_validity_description
        - document_chembl_id
        - document_journal
        - document_year
        - ligand_efficiency
        - molecule_chembl_id
        - molecule_pref_name
        - parent_molecule_chembl_id
        - pchembl_value
        - potential_duplicate
        - qudt_units
        - record_id
        - relation
        - src_id
        - standard_flag
        - standard_relation
        - standard_text_value
        - standard_type
        - standard_units
        - standard_upper_value
        - standard_value
        - target_chembl_id
        - target_organism
        - target_pref_name
        - target_tax_id
        - text_value
        - toid
        - type
        - units
        - uo_units
        - upper_value
        - value

cli:
  input_file: data/input/activity.csv

cache:
  namespace: "chembl_activity"

determinism:
  sort:
    by:
      - assay_chembl_id
      - molecule_chembl_id
    ascending:
      - true
      - true
    na_position: last
  column_order:
    - activity_comment
    - activity_id
    - activity_properties
    - assay_chembl_id
    - assay_description
    - assay_type
    - bao_endpoint
    - bao_format
    - bao_label
    - canonical_smiles
    - data_validity_comment
    - data_validity_description
    - document_chembl_id
    - document_journal
    - document_year
    - ligand_efficiency
    - molecule_chembl_id
    - molecule_pref_name
    - parent_molecule_chembl_id
    - pchembl_value
    - potential_duplicate
    - qudt_units
    - record_id
    - relation
    - src_id
    - standard_flag
    - standard_relation
    - standard_text_value
    - standard_type
    - standard_units
    - standard_upper_value
    - standard_value
    - target_chembl_id
    - target_organism
    - target_pref_name
    - target_tax_id
    - text_value
    - toid
    - type
    - units
    - uo_units
    - upper_value
    - value

  hashing:
    business_key_fields:
      - activity_id
      - row_subtype
      - row_index

validation:
  schema_out: bioetl.schemas.chembl_activity_schema.ChEMBLActivitySchema
