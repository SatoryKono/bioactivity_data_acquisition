[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioetl"
version = "1.0.0"
description = "Unified ETL framework for bioactivity data extraction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BioETL Team"}
]
keywords = ["bioactivity", "etl", "chembl", "data-extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # HTTP retry logic for resilient API clients
    "backoff>=2.2.1",
    "cachetools>=5.3.0",
    "click>=8.1.0",
    "numpy>=1.24",
    "packaging>=23",
    "pandas>=2.0.0",
    "pandera>=0.15.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0.1",
    "requests>=2.31.0",
    "structlog>=23.0.0",
    "typer>=0.9.0",
    "chembl-webresource-client>=0.10.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-httpserver>=1.0.6",
    "pytest-xdist>=3.3.0",
    "pytest-mock>=3.11.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.82.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.3.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.11",
    "pandas-stubs>=2.0.0",
    "faker>=20.0.0",
    "black>=23.0.0",
    "bandit>=1.7.5",
    "safety>=2.3.5",
    "detect-secrets>=1.4.0",
    "vulture>=2.11",
]

[project.scripts]
bioetl = "bioetl.cli.cli_app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bioetl" = ["configs/**/*.yaml"]
"*" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
    "src",
    "tests",
    "scripts",
]
exclude = [
    "build",
    "dist",
    "data",
    "docs/site",
    "htmlcov",
    "tmp",
    "typings",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
]
extend-select = [
    "A",   # shadowing builtins
    "B",   # bugbear
    "C4",  # comprehensions
    "I",   # import sorting (cross-check with isort)
    "N",   # pep-naming
    "RET", # return statements
    "S",   # security
    "SIM", # simplifications
    "TID", # tidy imports
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
fixable = ["ALL"]
unfixable = ["F401"]  # dead imports чаще требуют ручной оценки

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]
"scripts/**" = ["S603", "S607"]  # CLI-скрипты могут запускать shell-команды

[tool.ruff.lint.isort]
known-first-party = [
    "bioetl",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
packages = [
    "bioetl",
]
strict = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
show_error_codes = true
mypy_path = [
    "src",
    "src/typecheck/stubs",
]

[[tool.mypy.overrides]]
module = [
    "typer",
    "backoff",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "bioetl.schemas.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "bioetl.normalizers.*",
    "bioetl.pandera_pandas",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "bioetl.devtools.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests/bioetl", "tests/golden"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src", "tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=bioetl.cli.cli_app",
    "--cov=bioetl.cli.cli_command",
    "--cov=bioetl.cli.cli_entrypoint",
    "--cov=bioetl.cli.cli_registry",
    "--cov=bioetl.devtools",
    "--cov=bioetl.core.runtime.cli_pipeline_runner",
    "--cov=bioetl.pipelines.chembl",
    "--cov=bioetl.chembl.common",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=65",
    "--tb=short",
    "--durations=10",
    "--maxfail=5",
    "--disable-warnings",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "golden: Golden tests for deterministic output verification",
    "determinism: Bit-identical determinism verification tests",
    "smoke: Fast smoke checks for import and wiring validation",
    "slow: Slow tests (>5s)",
    "property: Property-based tests",
    "qc: Quality control tests",
    "schema: Schema validation tests",
    "api: External API tests",
    "benchmark: Performance benchmark tests",
    "cli: CLI tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pandas.errors.PerformanceWarning",
    "ignore::UserWarning:.*pandera.*",
    "ignore:Module.*was never imported.*:UserWarning",
    "ignore:.*coverage.*:UserWarning",
]

[tool.coverage.run]
source = ["src/bioetl"]
omit = [
    "*/tests/bioetl/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = false
skip_covered = false
skip_empty = false

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["bioetl"]
src_paths = ["src/bioetl", "tests/bioetl"]
combine_as_imports = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503", "B008", "C901"]
extend-select = ["B", "C4"]

[tool.pylint.main]
py-version = "3.10"
fail-under = 8.0
ignore = [
    "data",
    "docs/site",
    "build",
    "dist",
]
ignore-paths = [
    "^data/.*",
    "^docs/site/.*",
    "^build/.*",
    "^dist/.*",
]
jobs = 0
persistent = false
suggestion-mode = true
init-hook = "import sys; from pathlib import Path; sys.path.append(str(Path('src').resolve()))"

[tool.pylint.basic]
good-names = ["df", "id", "i", "j", "k", "x", "y"]
extension-pkg-allow-list = ["pydantic"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-few-public-methods",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
min-similarity-lines = 10

[tool.pylint.reports]
output-format = "colorized"
score = false

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
extraPaths = ["src"]

[[tool.pyright.overrides]]
include = ["tests/**"]
reportMissingImports = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUntypedClassDecorator = false
reportUntypedFunctionDecorator = false

[[tool.pyright.overrides]]
module = ["typer", "backoff", "pytest", "pytest_httpserver"]
reportMissingImports = false
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUntypedClassDecorator = false
reportUntypedFunctionDecorator = false

[[tool.pyright.overrides]]
include = ["src/bioetl/cli/**"]
reportMissingImports = false
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUntypedClassDecorator = false
reportUntypedFunctionDecorator = false

[[tool.pyright.overrides]]
include = ["src/bioetl/pipelines/assay/**"]
reportMissingImports = false
reportUnknownVariableType = false

[[tool.pyright.overrides]]
include = ["src/bioetl/clients/chembl_iterator.py"]
reportMissingImports = false
reportUnknownVariableType = false